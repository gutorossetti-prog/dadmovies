<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bananal em plantação</title>
  <desc id="desc">Uma plantação de bananas cinematográfica ao pôr do sol, placeholder espirituoso para a seção de séries.</desc>
