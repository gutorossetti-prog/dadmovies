    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#446d2f"/><stop offset="1" stop-color="#17351f"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f7437"/><stop offset="1" stop-color="#182c1d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".28"/></filter>
  </defs>
